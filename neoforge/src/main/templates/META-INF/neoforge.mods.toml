modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "opencomputers/textures/gui/logo.png"
credits = "Inspired by a couple of other mods, most notably ComputerCraft."
authors = "Florian 'Sangar' Nuecke, Johannes 'Lord Joda' Lohrer"
description = '''
This mod adds modular computers and robots that can be programmed in Lua.
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "projectred_transmission"
    mandatory = false
    versionRange = "[4.22.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "cb_multipart"
    mandatory = false
    versionRange = "[1.21.1-3.5.0,)"
    ordering = "AFTER"
    side = "BOTH"
