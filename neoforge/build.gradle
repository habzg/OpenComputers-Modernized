plugins {
    id 'net.neoforged.moddev'
    id 'idea'
}

sourceSets.main.resources {
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id + "-neoforge"
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            programArguments.addAll '--username', 'Dev', '--uuid', '380df991-f603-344c-a090-369bad2a924a'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        client2 {
            client()
            gameDirectory = project.file('runs/client2')
            programArguments.addAll '--username', 'Player', '--uuid', 'a01e3843-e521-3998-958a-f459800e4d11'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    commonJava { canBeResolved = true; canBeConsumed = false }
    commonResources { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    // Project dependencies
    compileOnly(project(':api'))
    compileOnly(project(':core-api'))
    compileOnly(project(':core'))

    // OC repack libraries
    compileOnly("li.cil.repack:OC-JNLua:${jnlua_version}")
    implementation files(rootProject.tasks.named('relocateTypesafe'))
    compileOnly("li.cil.repack:OC-LuaJ:${luaj_version}")
    implementation("li.cil.repack:OC-JNLua-Natives:${jnlua_natives_version}")

    // Integration - compile-time only (API jars)
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}")
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    compileOnly("mrtjp:ProjectRed:${minecraft_version}-${pr_version}:api")
    compileOnly("net.commoble.morered:morered-${minecraft_version}:${morered_version}")
    compileOnly("maven.modrinth:tis3d:MC1.21.1-neoforge-${tis3d_version}")
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    compileOnly("mcp.mobius.waila:wthit-api:neo-${wthit_version}")
    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}:api")
    compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")

    // Integration - runtime only
    runtimeOnly("mcp.mobius.waila:wthit:neo-${wthit_version}")
    runtimeOnly("mcjty.theoneprobe:theoneprobe:${top_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")
    runtimeOnly("mrtjp:ProjectRed:${minecraft_version}-${pr_version}:core")
    runtimeOnly("mrtjp:ProjectRed:${minecraft_version}-${pr_version}:transmission")
    runtimeOnly("maven.modrinth:rftools-base:${rftools_base_version}")
    runtimeOnly("net.commoble.morered:morered-${minecraft_version}:${morered_version}")
    runtimeOnly("maven.modrinth:tis3d:MC1.21.1-neoforge-${tis3d_version}")
    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")
    runtimeOnly("maven.modrinth:markdownmanual:MC1.21.1-neoforge-${markdownmanual_version}")
    runtimeOnly("thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}")
    runtimeOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")

    // Integration - compile + runtime (full jars)
    implementation("com.enderio:enderio:${enderio_version}")
    implementation("io.codechicken:CodeChickenLib:${minecraft_version}-${codechickenlib_version}")
    implementation("io.codechicken:CBMultipart:${minecraft_version}-${cbmultipart_version}")
    implementation("io.codechicken:EnderStorage:${minecraft_version}-${enderstorage_version}")
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}")
    implementation("maven.modrinth:rftools-utility:${rftools_utility_version}")
    implementation("maven.modrinth:mcjtylib:${mcjtylib_version}")
    implementation("maven.modrinth:applied-mekanistics:${appmek_version}")
    implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    implementation("maven.modrinth:jade:${jade_version}+neoforge")
    implementation("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
    implementation("mekanism:Mekanism:${minecraft_version}-${mekanism_version}")
    implementation("com.refinedmods.refinedstorage:refinedstorage-neoforge:${rs2_version}")
    implementation("com.refinedmods.refinedstorage:refinedstorage-mekanism-integration:${rs2mekanism_version}")

    // Source set merging
    commonJava(project(path: ':core-api', configuration: 'commonJava'))
    commonResources(project(path: ':core-api', configuration: 'commonResources'))
    commonJava(project(path: ':core', configuration: 'commonJava'))
    commonResources(project(path: ':core', configuration: 'commonResources'))
    commonJava(project(path: ':api', configuration: 'commonJava'))
    commonResources(project(path: ':api', configuration: 'commonResources'))
    commonJava(project(path: ':neoforge-api', configuration: 'commonJava'))
    commonResources(project(path: ':neoforge-api', configuration: 'commonResources'))

    additionalRuntimeClasspath("li.cil.repack:OC-JNLua-Natives:${jnlua_natives_version}")
}

// Merge bundled libraries into the mod's build output so they are part of the
// mod jar: OC-JNLua (LuaState in the same classloader as the code calling
// System.load(), required for JNI resolution), OC-LuaJ, OC-JNLua-Natives and
// com.typesafe:config (used by OCSettings). This mirrors the original 1.12.2
// build, which embedded all of these into the mod jar.
def embeddedConfig = configurations.create('embedded') {
    canBeResolved = true
    canBeConsumed = false
}
dependencies {
    embedded("li.cil.repack:OC-JNLua:${jnlua_version}")
    embedded("li.cil.repack:OC-LuaJ:${luaj_version}")
    embedded("li.cil.repack:OC-JNLua-Natives:${jnlua_natives_version}")
    embedded files(rootProject.tasks.named('relocateTypesafe'))
}
def embeddedDir = layout.buildDirectory.dir('embedded')
def extractEmbedded = tasks.register('extractEmbedded', Copy) {
    dependsOn(rootProject.tasks.named('relocateTypesafe'))
    doFirst {
        delete embeddedDir
    }
    from({ embeddedConfig.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
        exclude '.keep'
    }
    into embeddedDir
}
sourceSets.main.output.dir(['builtBy': extractEmbedded], embeddedDir)
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    filesMatching("application.conf") {
        filter { line ->
            line.replace("@version@", project.findProperty("mod_version") ?: "0.0.0")
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
