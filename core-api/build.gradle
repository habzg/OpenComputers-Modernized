plugins {
    id 'java-library'
}

base {
    archivesName = mod_id + "-core-api"
}

var tagsDir = layout.buildDirectory.dir("generated/sources/tags/java/main")
var generateTags = tasks.register("generateTags", Sync) {
    from "src/main/templates"
    into tagsDir
    inputs.property("mod_version", mod_version)
    inputs.property("mod_id", mod_id)
    inputs.property("mod_name", mod_name)
    expand(
        mod_version: mod_version,
        mod_id: mod_id,
        mod_name: mod_name
    )
    filteringCharset = "UTF-8"
}

sourceSets.main.java.srcDir(tagsDir)
tasks.named('compileJava') {
    dependsOn(generateTags)
}

configurations {
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    api project(':api')
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.configureEach { task ->
    if (task.name == 'sourcesJar') {
        task.dependsOn(generateTags)
    }
}
